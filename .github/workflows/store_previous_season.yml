
name: Store data from previous season

on:
  schedule:
    - cron: "0 21 1 1,6 *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and replace game data
        run: python scripts/store_previous_season.py

      - name: Commit updated game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_games.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update latest game data"
            git push
          fi
